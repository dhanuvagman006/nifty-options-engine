name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: 2026 replay smoke test (realised-vol proxy, no VIX file)
        run: python run.py backtest --bars data/nifty_5m_2017_2026.parquet --from 2026-09-01 --no-chain -q
